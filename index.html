<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thomas & Elsie Bobadilla - Wedding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Font for fancy script + clean text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: #2b2835;
      font-family: "Playfair Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
      background: #fdf6ff;
      position: relative;
      overflow-x: hidden;
    }
    /* Background images: flowers + cross (you uploaded them to same repo) */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      z-index: -3;
      filter: blur(1px);
    }

    /* Main flowers image */
    body::before {
      background-image: url("spring-flowers-65de4a13478ee.avif");
    }

    /* Overlay: extra flowers blended */
    body::after {
      background-image:
        linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0.9)),
        url("Beautiful-Flowers.jpg.webp");
    }

    /* Flowers behind the details card */
    .details::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.9)),
        url("images.jpeg");
      background-size: cover;
      background-position: center;
      opacity: 0.38;
      z-index: -2;
      filter: blur(0.3px);
    }  

    .page-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.8rem 1.5rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 2.1rem;
    }

    header {
      text-align: center;
    }
    header h1 {
      font-family: "Great Vibes", cursive;
      font-size: 3.1rem;
      color: #7b4064;
    }
    header h1 span {
      display: block;
      margin-top: 0.3rem;
      font-family: "Playfair Display", serif;
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5a4a63;
    }
    header p {
      margin-top: 1rem;
      font-size: 1rem;
      letter-spacing: 0.03em;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 1.8rem;
    }
    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffffee;
      border-radius: 1.4rem;
      box-shadow: 0 14px 32px rgba(0,0,0,0.12);
      padding: 1.9rem 1.7rem 2.1rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(3px);
    }

    /* Wedding details card with cross + soft flowers */
    .details {
      text-align: center;
    }

    .details::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.9)),
        url("images.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.38;
      z-index: -2;
      filter: blur(0.3px);
    }

    .cross {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 130px;
      opacity: 0.4;
      z-index: -1;
    }
    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      background: linear-gradient(180deg, #b5835a, #f7e2b6);
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(181,120,60,0.5);
    }
    .cross::before {
      width: 22px;
      height: 130px;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }
    .cross::after {
      width: 90px;
      height: 20px;
      left: 50%;
      top: 42px;
      transform: translateX(-50%);
    }

    .details h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .details p {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .details .line {
      width: 65%;
      max-width: 240px;
      height: 1px;
      margin: 1.2rem auto 1.1rem;
      background: linear-gradient(90deg, transparent, #d59adf, transparent);
    }

    form label {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    form input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 0.6rem;
      border: 1px solid #d6cde3;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      background: rgba(252,252,255,0.9);
    }
    form input:focus {
      outline: none;
      border-color: #ff8fb4;
      box-shadow: 0 0 0 2px #ffd7e8;
    }

    .radio-group {
      display: flex;
      gap: 1.4rem;
      margin-bottom: 1.1rem;
    }
    .radio-group label {
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.94rem;
    }
    .radio-group input {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff8fb4, #ffb86c);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.88rem;
      margin-top: 0.4rem;
      font-family: "Playfair Display", serif;
    }
    button:hover {
      filter: brightness(1.06);
    }

    .note {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 0.95rem;
      color: #7a7187;
    }

    footer {
      text-align: center;
      font-size: 1rem;
      padding-bottom: 1.6rem;
      color: #5f4a63;
    }
    footer span {
      display: inline-block;
      padding: 0.4rem 1.4rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      font-family: "Great Vibes", cursive;
      font-size: 1.6rem;
      color: #7b4064;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="page-wrap">
      <header>
        <h1>Thomas &amp; Elsie Bobadilla
          <span>Our Wedding Day</span>
        </h1>
        <p>Please RSVP to celebrate with us.</p>
      </header>

      <div class="content">
        <!-- Left: Wedding details with flowers + cross -->
        <section class="card details">
          <div class="cross" aria-hidden="true"></div>
          <h2>Wedding Details</h2>
          <div class="line"></div>
          <p><strong>Date:</strong> April 18, 2026</p>
          <p><strong>Time:</strong> 11:00 a.m.</p>
          <p><strong>Location:</strong> Holy Family Church</p>
        </section>

        <!-- Right: RSVP form (Netlify Forms) -->
        <main class="card">
          <form id="rsvpForm" name="wedding-rsvp" method="POST" data-netlify="true">
            <input type="hidden" name="form-name" value="wedding-rsvp">

            <label for="guestName">Full name</label>
            <input id="guestName" name="guestName" type="text" required>

            <label>Will you be attending?</label>
            <div class="radio-group">
              <label><input type="radio" name="attendance" value="Yes" required> Yes</label>
              <label><input type="radio" name="attendance" value="No" required> No</label>
            </div>

            <label for="guestCount">How many people (including you)?</label>
            <input id="guestCount" name="guestCount" type="number" min="1" max="5" value="1" required>

            <button type="submit">Submit RSVP</button>
            <p class="note">
              Your response will be sent privately to Thomas &amp; Elsie.
            </p>
          </form>
        </main>
      </div>

      <footer>
        <span>With love, Thomas &amp; Elsie</span>
      </footer>
    </div>
  </div>
</body>
</html>
